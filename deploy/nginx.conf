server {
    listen 80;
    server_name orders.rpdesign.pk;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name orders.rpdesign.pk;

    # Allow designer video & multi-image uploads (up to 100 MB)
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/orders.rpdesign.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orders.rpdesign.pk/privkey.pem;

    # Meta WhatsApp Cloud API Webhook endpoint (must respond 200 immediately)
    location /api/webhooks/whatsapp {
        proxy_pass http://app:3000/api/webhooks/whatsapp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
